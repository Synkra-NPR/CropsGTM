org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true
# 禁止自动下载 JDK，固定使用本机已安装的 JDK 17
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.paths=C:/Java/jdk-17.0.12

# Minecraft / Forge
minecraft_version=1.20.1
forge_version=47.4.0

# Mod 元信息，源自 CropNH，供 mods.toml 与 README 使用
mod_version=2.1.1-alpha
maven_group=com.synkra.cropsgtm
archives_base_name=cropsgtm
mod_id=cropsgtm
mod_name=CropsGTM
mod_url=https://github.com/GTNewHorizons/CropsNH
mod_author=InfinityRaider, mitchej123, C0bra5, GTNHTeam
mod_license=LGPL-3.0

# 开发期依赖 GregTech Modern 1.20.1 及其界面库（MUI / LDLib）
# 8.0.0-dev / 3.3.1-dev 尚未发布到公共仓库，需要 mavenLocal 中存在本地构建
gtceu_version=7.5.3
gtceu_version_range=[7.5.3,)
ldlib_version=1.0.40.b
configuration_version=2.2.0
registrate_version=MC1.20-1.3.11
